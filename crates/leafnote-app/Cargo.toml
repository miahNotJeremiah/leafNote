[package]
name = "leafnote-app"
description = "leafNote desktop GUI: an iced front-end over leafnote-core (local-first OneNote-style notebook app)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "leafnote"
path = "src/main.rs"

[dependencies]
leafnote-core.workspace = true
iced = { version = "0.13", features = ["canvas"] }
rfd = "0.14"
open = "5"
tracing.workspace = true
anyhow.workspace = true

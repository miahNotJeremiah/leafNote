[workspace]
resolver = "2"
members = ["crates/leafnote-core", "crates/leafnote-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/leafnote/leafnote"
authors = ["leafNote contributors"]

[workspace.dependencies]
# --- internal ---
leafnote-core = { path = "crates/leafnote-core" }

# --- OneNote native file-format support (.one / .onetoc2 / .onepkg) ---
onenote_parser = { version = "2.0.0", features = ["onepkg"] }
typed-path = "0.12"
time = { version = "0.3", features = ["macros"] }

# --- GUI (pure Rust, cross-platform) ---
iced = { version = "0.13", features = ["canvas", "image"] }

# --- geometry / vector rendering helpers for the freeform canvas ---
lyon_path = "1.0"
lyon_tessellation = "1.0"

# --- storage / serialization for leafNote's native local format ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# --- misc ---
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
dirs = "5"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
